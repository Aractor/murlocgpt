<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A World of Warcraft-inspired chatbot that speaks fluent Murloc.">
  <title>MurlocGPT</title>
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="stylesheet" href="./styles.css?v=10">
  <script src="./voice.js?v=8" defer></script>
  <script src="./chat.js?v=7" defer></script>
</head>
<body>
  <header class="banner">
    <div class="bar">
      <a class="brand" href="./">Murloc<span>GPT</span></a>
      <div class="appearance">
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </div>
  </header>
  <main>
    <section class="chat" aria-labelledby="title">
      <div class="intro">
        <picture>
          <source type="image/webp" srcset="./portrait-100.webp 100w, ./portrait-200.webp 200w, ./portrait-300.webp 300w" sizes="(max-height: 500px) 32px, (max-width: 600px) 48px, 100px">
          <img class="portrait" src="./portrait-100.jpg" srcset="./portrait-100.jpg 100w, ./portrait-200.jpg 200w, ./murloc-fish-portrait.jpg 300w" sizes="(max-height: 500px) 32px, (max-width: 600px) 48px, 100px" width="100" height="100" alt="A smiling Murloc waves while holding a fish.">
        </picture>
        <h1 id="title">Ask a Murloc.</h1>
        <p>Send a message and hear what it has to gurgle.</p>
      </div>
      <div id="history" class="history" role="log" aria-label="Conversation" tabindex="0"></div>
      <template id="audio-template">
        <button class="playback" type="button" data-state="play" aria-label="Play Murloc audio" title="Play Murloc audio">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
            <circle class="loading-icon" cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="29 15"/>
            <path class="play-icon" d="M8 4l13 8-13 8z"/>
            <path class="pause-icon" d="M6 4h4v16H6zm8 0h4v16h-4z"/>
            <path class="replay-icon" d="M4 11a8 8 0 1 1 2 6m-2-6V5m0 6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </template>
      <div class="composer">
        <div id="status" role="status" aria-atomic="true"></div>
        <form id="chat-form">
          <label class="sr-only" for="message">Message MurlocGPT</label>
          <textarea id="message" rows="2" maxlength="2000" placeholder="Ask anything" aria-describedby="keyboard"></textarea>
          <div class="composer-toolbar">
            <label class="sr-only" for="model">Cosmetic model</label>
            <select id="model" aria-describedby="model-hint">
              <option>MurlocGPT-5.5</option>
              <option>MurlocGPT-5.5 Arcane</option>
              <option>MurlocGPT-5.5 Whelp</option>
              <option>MurlocGPT-4o Tidecaller</option>
            </select>
            <button id="send" type="submit" aria-label="Send"><span aria-hidden="true">↑</span></button>
          </div>
        </form>
        <span id="model-hint" class="sr-only">Model selection is cosmetic.</span>
        <p id="keyboard">Enter to send · Shift + Enter for a new line</p>
        <noscript>Enable JavaScript to send messages.</noscript>
      </div>
    </section>
    <footer>Unofficial World of Warcraft fan project</footer>
  </main>
</body>
</html>
